name: 更新 FCN 資料

on:
  schedule:
    # 排定台北時間 05:40（UTC 21:40；紐約 17:40，冬令 16:40）。GitHub 排程實際常延遲約 2 小時
    # （10/15–10/20 都在 09:30–10:06 才執行），提早排定讓資料大約在 08:00 前更新完成
    - cron: "40 21 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["tickers.txt"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 整理檔案位置
        run: |
          mkdir -p scripts data
          [ -f update_data.py ] && cp update_data.py scripts/update_data.py || true
          [ -f requirements.txt ] && cp requirements.txt scripts/requirements.txt || true
          [ -f data/quotes.json ] || { [ -f quotes.json ] && cp quotes.json data/quotes.json; } || true

      - name: 安裝套件
        run: pip install -r scripts/requirements.txt

      - name: 抓取資料
        run: python scripts/update_data.py

      - name: 提交更新
        run: |
          git config user.name "fcn-radar-bot"
          git config user.email "fcn-radar-bot@users.noreply.github.com"
          # 執行期間分支可能已有新提交（例如另一次更新、修改 tickers.txt）：
          # 先保存本次資料，再移到分支最新版本上覆寫，避免 rebase 衝突
          BRANCH="${GITHUB_REF_NAME}"
          mkdir -p "$RUNNER_TEMP/out" && cp data/quotes.json data/meta.json "$RUNNER_TEMP/out/"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          cp "$RUNNER_TEMP/out/quotes.json" "$RUNNER_TEMP/out/meta.json" data/
          git add data/
          if git diff --cached --quiet; then
            echo "資料沒有變化"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            # GitHub 偶爾回傳 500，重試幾次
            for i in 1 2 3 4; do git push origin "HEAD:$BRANCH" && break; [ $i = 4 ] && exit 1; sleep $((i * 10)); done
          fi
