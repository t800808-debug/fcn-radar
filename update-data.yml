name: 更新 FCN 資料

on:
  schedule:
    # 台北時間週二到週六 06:40（美股收盤後）→ 只更新美股
    - cron: "40 22 * * 1-5"
    # 台北時間週一到週五 15:10（日股收盤後）→ 只更新日股
    - cron: "10 7 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["tickers.txt"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 整理檔案位置
        run: |
          mkdir -p scripts data
          [ -f update_data.py ] && cp update_data.py scripts/update_data.py || true
          [ -f requirements.txt ] && cp requirements.txt scripts/requirements.txt || true
          [ -f data/quotes.json ] || { [ -f quotes.json ] && cp quotes.json data/quotes.json; } || true

      - name: 安裝套件
        run: pip install -r scripts/requirements.txt

      - name: 抓取資料
        env:
          # 排程依時段只更新該市場；手動執行或改 tickers.txt 時兩個市場都更新
          MARKETS: ${{ github.event.schedule == '40 22 * * 1-5' && 'US' || github.event.schedule == '10 7 * * 1-5' && 'JP' || '' }}
        run: python scripts/update_data.py

      - name: 提交更新
        run: |
          git config user.name "fcn-radar-bot"
          git config user.email "fcn-radar-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "資料沒有變化"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
