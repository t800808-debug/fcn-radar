name: 更新 FCN 資料

on:
  schedule:
    # 每天台北時間 07:40（UTC 23:40）更新美股與日股。GitHub 整點排程常延遲 30–60 分鐘甚至跳過，
    # 提早並避開整點，讓資料大約在 08:00 前後更新完成
    - cron: "40 23 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["tickers.txt"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 整理檔案位置
        run: |
          mkdir -p scripts data
          [ -f update_data.py ] && cp update_data.py scripts/update_data.py || true
          [ -f requirements.txt ] && cp requirements.txt scripts/requirements.txt || true
          [ -f data/quotes.json ] || { [ -f quotes.json ] && cp quotes.json data/quotes.json; } || true

      - name: 安裝套件
        run: pip install -r scripts/requirements.txt

      - name: 抓取資料
        run: python scripts/update_data.py

      - name: 提交更新
        run: |
          git config user.name "fcn-radar-bot"
          git config user.email "fcn-radar-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "資料沒有變化"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
